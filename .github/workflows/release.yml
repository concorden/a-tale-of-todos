name: Build macOS app

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: bash scripts/swift.sh test

      - name: Build and package universal app
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash scripts/package-release.sh "$RELEASE_TAG"

      - name: Save downloadable build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: A-Tale-of-Todos-macOS
          path: |
            build/A-Tale-of-Todos-macOS.zip
            build/A-Tale-of-Todos-macOS.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish tagged release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(build/A-Tale-of-Todos-macOS.zip build/A-Tale-of-Todos-macOS.zip.sha256)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            flags=(--verify-tag --title "A Tale of Todos $RELEASE_TAG" --notes-file .github/release-notes.md --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" "${flags[@]}"
          fi
